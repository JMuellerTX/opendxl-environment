name: Pinned releases

# A pinned artifact is reproducible and goes stale. This notices the staleness
# instead of trading the reproducibility away.
#
# It reads every GitHub release asset this repository pins in a Dockerfile,
# asks each source repository for its latest release, and reports when one of
# them has moved on. It never changes a pin: a bump is a decision, and it
# should arrive as a reviewed commit rather than as a different image from the
# same `docker build`.
#
# The finding always goes to the job summary. It also tries to open - or
# update - a single issue, which is the better channel; GitHub disables issues
# on a fork by default, so when that is not available the job fails instead.
# A finding nobody can see is not a finding.
#
# Why this exists at all: the images that install from a branch instead of a
# release do update by themselves, and on 2026-09-08 that broke a build - a
# commit in another repository at 12:04 made the broker image fail at 13:59,
# without anyone touching the broker. Pinning is the fix; this is what keeps
# pinning honest.
#
# The parser is generic: any `https://github.com/<owner>/<repo>/releases/download/<tag>/...`
# in a Dockerfile is checked, so this file can be copied into another
# repository unchanged.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Compare every pinned release against the latest one
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eu
        : > outdated.md
        found=0

        # urldecode, because a version like 0.1.4+fork.1 appears as 0.1.4%2Bfork.1
        # in the URL. Done with python rather than printf '%b': bash does not
        # decode \xHH there reliably, and the first version of this silently
        # compared "v0.1.4x2Bfork.1" against the real tag - a weekly red build
        # for a pin that was in fact current.
        decode() { python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.argv[1]))' "$1"; }

        grep -rhoE 'https://github\.com/[^/]+/[^/]+/releases/download/[^/]+/' \
             --include='Dockerfile*' . | sort -u | while read -r url; do
          rest="${url#https://github.com/}"
          owner="${rest%%/*}"; rest="${rest#*/}"
          repo="${rest%%/*}"; rest="${rest#*/releases/download/}"
          pinned="$(decode "${rest%%/*}")"

          latest="$(gh api "repos/$owner/$repo/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$latest" ]; then
            echo "  $owner/$repo: no release found, skipping"
            continue
          fi
          if [ "$pinned" = "$latest" ]; then
            echo "  $owner/$repo: $pinned is current"
          else
            echo "  $owner/$repo: pinned $pinned, latest $latest"
            echo "- \`$owner/$repo\`: pinned **$pinned**, latest **$latest** — <https://github.com/$owner/$repo/releases/tag/$latest>" >> outdated.md
            found=1
          fi
        done

        # Collective git tags, the other kind of pin in these Dockerfiles. A release
        # asset has a 'latest release' to compare against; a tag like
        # fork-2026-09-21 does not, so the question is a different one: has the
        # branch it was cut from moved on since? Added because the pins introduced
        # on 2026-09-21 were invisible to the loop above, which only knows release
        # download URLs - twenty references that nothing watched.
        grep -rhoE 'github\.com/[^/]+/[^/@"]+@fork-[0-9]{4}-[0-9]{2}-[0-9]{2}[a-z-]*' \
             --include='Dockerfile*' . | sort -u | while read -r ref; do
          repo_part="${ref#github.com/}"
          owner="${repo_part%%/*}"; rest="${repo_part#*/}"
          repo="${rest%%@*}"; tag="${rest#*@}"
          # The branch the tag stands for: the -epo-legacy suffix names it, else master.
          case "$tag" in *-epo-legacy) branch=epo-legacy ;; *) branch=master ;; esac
          tag_sha="$(gh api "repos/$owner/$repo/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)"
          head_sha="$(gh api "repos/$owner/$repo/commits/$branch" --jq .sha 2>/dev/null || true)"
          if [ -z "$tag_sha" ] || [ -z "$head_sha" ]; then
            echo "  $owner/$repo@$tag: cannot resolve, skipping"
            continue
          fi
          behind="$(gh api "repos/$owner/$repo/compare/$tag...$branch" --jq .ahead_by 2>/dev/null || echo 0)"
          if [ "${behind:-0}" -eq 0 ]; then
            echo "  $owner/$repo@$tag: current with $branch"
          else
            echo "  $owner/$repo@$tag: $branch is $behind commit(s) ahead"
            echo "- \`$owner/$repo@$tag\`: \`$branch\` is **$behind commit(s)** ahead — <https://github.com/$owner/$repo/compare/$tag...$branch>" >> outdated.md
          fi
        done

        # The loop runs in a subshell, so the file is the state that survives.
        if [ -s outdated.md ]; then
          echo "outdated=true" >> "$GITHUB_OUTPUT"
        else
          echo "outdated=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Report
      if: steps.check.outputs.outdated == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eu
        title="A pinned release has moved on"
        {
          echo "One or more artifacts this image pins have a newer release:"
          echo
          cat outdated.md
          echo
          echo "The pins are \`ARG\`s in the Dockerfile, so a bump is a one-line change."
          echo "A collective tag entry means the branch moved on, not that the pin is"
          echo "broken - decide whether this image should carry the newer state."
          echo "They are deliberately pinned rather than resolved at build time: an image"
          echo "has to build the same way twice, and an artifact that follows a branch does"
          echo "not. This is the reminder, not an automatic update."
          echo
          echo "_Raised by \`.github/workflows/pinned-releases.yml\`._"
        } > body.md

        # Always visible, whatever else happens.
        {
          echo "## $title"
          echo
          cat body.md
        } >> "$GITHUB_STEP_SUMMARY"

        # An issue is the better channel, but GitHub disables issues on a fork
        # by default. If there is no channel, be a red build rather than a
        # quiet success.
        if ! gh issue list --state open --limit 1 >/dev/null 2>&1; then
          echo "::warning::Issues are disabled on this repository; reporting through the job summary and failing instead."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Issues are disabled here, so this job fails to stay visible. Enable issues to get one issue instead of a red build._" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
        if [ -n "$existing" ]; then
          gh issue edit "$existing" --body-file body.md
          echo "updated issue #$existing"
        else
          gh issue create --title "$title" --body-file body.md
        fi
